<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GNT</title>
<style>
:root{--bg:#12151d;--panel:#1b2030;--line:#2c3447;--text:#e8ecf4;--mute:#93a0b6;--acc:#8a96ff;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
header{display:flex;align-items:baseline;gap:10px;max-width:1100px;margin:0 auto 10px}
h1{margin:0;font-size:26px;letter-spacing:.04em}
header span{color:var(--mute);font-size:13px}
main{display:grid;gap:14px;max-width:1100px;margin:0 auto}
@media(min-width:900px){main{grid-template-columns:1fr 340px;align-items:start}}
.view{position:relative;background:#000;border-radius:10px;display:flex;justify-content:center;overflow:hidden}
canvas{display:block;max-width:100%;max-height:46vh;width:auto;height:auto}
#hint{position:absolute;inset:0;margin:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:16px}
#hint[hidden]{display:none}
.tb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
button,.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;display:inline-block}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pri{background:var(--acc);color:#0d1020;border-color:var(--acc);font-weight:700;margin-left:auto}
#tm{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.tl{position:relative;background:var(--panel);border-radius:8px;touch-action:none;cursor:pointer;user-select:none}
#clips{display:flex;height:58px}
#tx{position:relative;height:30px;border-top:1px solid var(--line)}
.cap{position:absolute;top:3px;bottom:3px;min-width:6px;background:hsl(30 55% 38%);border-radius:5px;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap}
.cap.on{outline:2px solid var(--acc);background:hsl(30 70% 46%)}
.clip{height:100%;overflow:hidden;padding:6px 8px;border-right:2px solid var(--bg);background:hsl(230 30% 28%);font-size:12px;display:flex;flex-direction:column;white-space:nowrap}
.clip.on{outline:2px solid var(--acc);outline-offset:-2px;background:hsl(230 45% 38%)}
.clip i{color:var(--mute);font-style:normal}
#ph{position:absolute;top:-4px;bottom:-4px;left:0;width:2px;background:#ff5d6c;pointer-events:none}
aside{background:var(--panel);border-radius:10px;padding:12px}
#tabs{display:flex;gap:6px;margin-bottom:12px}
#tabs button{flex:1}
#tabs .on{background:var(--acc);color:#0d1020;border-color:var(--acc);font-weight:700}
.sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px}
.sl input{grid-column:1/-1;width:100%;accent-color:var(--acc)}
output{color:var(--mute);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.row .on{border-color:var(--acc);color:var(--acc)}
.hint{color:var(--mute);margin:0}
h2{font-size:13px;color:var(--mute);margin:14px 0 6px;font-weight:500}
#tabs{flex-wrap:wrap}#tabs button{flex:1 1 auto;padding:8px 6px}
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{min-height:64px;resize:vertical}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.colors label{display:flex;justify-content:space-between;align-items:center;gap:6px}
input[type=color]{width:40px;height:28px;padding:0;border:0;background:none}
.list{max-height:260px;overflow:auto;display:grid;gap:6px}.item{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.item small{color:var(--mute);font-variant-numeric:tabular-nums;cursor:pointer}.item.on small{color:var(--acc)}
.busy main{pointer-events:none;opacity:.7}
.busy .tb{pointer-events:none}
</style>
</head>
<body>
<header><h1>GNT</h1><span>Cắt ghép video và chỉnh màu ngay trên trình duyệt</span></header>
<main>
<section>
  <div class="view"><canvas id="cv" width="1280" height="720"></canvas><p id="hint">Bấm “＋ Nhập” để thêm video hoặc ảnh</p></div>
  <div class="tb">
    <label class="btn">＋ Nhập<input type="file" id="f" accept="video/*,image/*" multiple hidden></label>
    <button id="pp" aria-label="Phát/Dừng">▶</button><span id="tm">00:00.0 / 00:00.0</span>
    <button id="sp">Cắt đôi</button><button id="dp">Nhân bản</button><button id="dl">Xóa</button>
    <button id="ex" class="pri">Xuất video</button>
  </div>
  <div id="tl" class="tl"><div id="clips"></div><div id="tx"></div><i id="ph"></i></div>
</section>
<aside>
  <nav id="tabs"><button data-t="edit">Chỉnh sửa</button><button data-t="col">Màu</button><button data-t="txt">Chữ</button><button data-t="cap">Phụ đề</button><button data-t="frame">Khung</button></nav>
  <div id="panel"></div>
</aside>
</main>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
const RATIOS={'16:9':[1280,720],'9:16':[720,1280],'1:1':[1000,1000],'4:5':[800,1000],'4:3':[960,720]};
const COL0=()=>({br:0,ct:0,sa:0,ex:0,tp:0,ti:0,fa:0,vg:0});
const PRESETS={'Gốc':{},'Trắng đen':{sa:-100,ct:15},'Điện ảnh':{ct:20,sa:-10,tp:-12,fa:8,vg:35},'Tươi':{sa:40,ct:10,br:5},'Hoài cổ':{tp:30,fa:25,sa:-20,vg:25},'Lạnh':{tp:-40,ti:5}};
const COLS=[['br','Độ sáng',-100,100],['ex','Phơi sáng',-100,100],['ct','Tương phản',-100,100],['sa','Bão hòa',-100,100],['tp','Nhiệt độ',-100,100],['ti','Sắc thái',-100,100],['fa','Phai màu',0,100],['vg','Tối góc',0,100]];
const FONTS=[['Mặc định','system-ui,sans-serif'],['Serif','Georgia,serif'],['Đậm','Impact,"Arial Black",sans-serif'],['Máy chữ','"Courier New",monospace'],['Viết tay','"Comic Sans MS",cursive']];
const ANIMS=[['none','Không'],['fade','Mờ dần'],['slide','Trượt lên'],['pop','Bật to'],['type','Gõ chữ'],['karaoke','Karaoke']];
const LANGS=[['vi-VN','Tiếng Việt'],['en-US','English'],['ja-JP','日本語'],['ko-KR','한국어'],['zh-CN','中文']];
const CAPSTYLE={color:'#ffffff',sw:0,sh:0,bga:60,bgc:'#000000',bold:false,size:5,y:88,anim:'none'};
const TPL={'Mặc định':{},'Phụ đề phim':CAPSTYLE,'TikTok vàng':{color:'#ffe14a',stroke:'#000000',sw:6,sh:0,bga:0,bold:true,size:8,y:70,anim:'pop'},'Neon':{color:'#7df9ff',stroke:'#0a2a5e',sw:2,shc:'#7df9ff',sh:18,bga:0,bold:true,size:8,y:50,anim:'fade'},'Karaoke':{color:'#ffffff',hl:'#ff4d8d',stroke:'#000000',sw:5,sh:0,bga:0,bold:true,size:7,y:80,anim:'karaoke'},'Tiêu đề':{font:'Impact,"Arial Black",sans-serif',color:'#ffffff',stroke:'#000000',sw:4,sh:0,bga:0,size:12,y:45,anim:'slide'},'Hộp trắng':{color:'#111111',bgc:'#ffffff',bga:92,sw:0,sh:0,bold:true,size:6,y:82,anim:'fade'}};
const STY=['font','size','bold','italic','color','stroke','sw','shc','sh','bgc','bga','x','y','anim','hl'];
let texts=[],selT=null,recog=null,lang='vi-VN',clips=[],sel=null,t=0,playing=false,last=0,cur=null,bg='#000000',ratio='16:9',tab='edit',drag=false,exporting=false,clip=null,rec,ac,dest;
const dur=c=>(c.out-c.in)/c.speed,total=()=>clips.reduce((a,c)=>a+dur(c),0);
const fmt=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+(x%60).toFixed(1).padStart(4,'0');
const cl=c=>({...c,id:Math.random(),col:{...c.col}});
function locate(x){let s=0;for(const c of clips){const d=dur(c);if(x<s+d||c===clips[clips.length-1])return{c,s,l:Math.min(Math.max(x-s,0),d)};s+=d}return null}
function initAudio(){if(!ac){ac=new AudioContext();dest=ac.createMediaStreamDestination()}ac.resume()}

async function addFiles(files){
  initAudio();
  for(const f of files){
    const url=URL.createObjectURL(f),isV=f.type.startsWith('video'),el=document.createElement(isV?'video':'img');
    await new Promise(r=>{el.onerror=r;if(isV){el.preload='auto';el.playsInline=true;el.onloadedmetadata=r}else el.onload=r;el.src=url});
    const w=isV?el.videoWidth:el.naturalWidth,h=isV?el.videoHeight:el.naturalHeight,max=isV?el.duration:30;
    if(!w||!isFinite(max))continue;
    if(isV){el.onseeked=()=>{if(!playing)render()};try{const s=ac.createMediaElementSource(el);s.connect(ac.destination);s.connect(dest)}catch(e){}}
    if(!clips.length)setRatio(w<h?'9:16':'16:9');
    sel={id:Math.random(),name:f.name.replace(/\.[^.]+$/,''),el,isV,w,h,max,in:0,out:isV?max:3,speed:1,rot:0,flip:false,zoom:100,x:0,y:0,op:100,col:COL0()};
    clips.push(sel);
  }
  refresh();
}

function render(){
  const W=cv.width,H=cv.height;
  cx.globalAlpha=1;cx.filter='none';cx.globalCompositeOperation='source-over';cx.fillStyle=bg;cx.fillRect(0,0,W,H);
  const p=locate(t);updateTime();if(!p)return;
  const c=p.c,K=c.col,sw=c.rot%2,rw=sw?c.h:c.w,rh=sw?c.w:c.h,k=Math.min(W/rw,H/rh)*c.zoom/100,w=c.w*k,h=c.h*k;
  cx.save();
  cx.translate(W/2+c.x*W/100,H/2+c.y*H/100);cx.rotate(c.rot*Math.PI/2);cx.scale(c.flip?-1:1,1);cx.globalAlpha=c.op/100;
  cx.filter=`brightness(${(1+K.br/100)*(1+K.ex/100)}) contrast(${1+K.ct/100}) saturate(${1+K.sa/100})`;
  cx.drawImage(c.el,-w/2,-h/2,w,h);
  cx.filter='none';cx.beginPath();cx.rect(-w/2,-h/2,w,h);cx.clip();
  const f=(col,a,m)=>{if(a>0){cx.globalCompositeOperation=m;cx.fillStyle=`rgba(${col},${a})`;cx.fillRect(-W,-H,2*W,2*H)}};
  f(K.tp>0?'255,150,40':'40,130,255',Math.abs(K.tp)/100*.4,'overlay');
  f(K.ti>0?'60,255,100':'255,60,200',Math.abs(K.ti)/100*.3,'overlay');
  f('210,214,222',K.fa/100*.4,'source-over');
  if(K.vg>0){const g=cx.createRadialGradient(0,0,Math.min(w,h)*.25,0,0,Math.hypot(w,h)/2);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${K.vg/100*.85})`);cx.globalCompositeOperation='source-over';cx.fillStyle=g;cx.fillRect(-W,-H,2*W,2*H)}
  cx.restore();
  texts.forEach(x=>{if(t>=x.start&&t<x.start+x.dur)drawText(x)});
}
function drawText(x){
  const W=cv.width,H=cv.height,u=H/720,a=t-x.start,e=Math.min(1,a/.35),fs=x.size/100*H;
  let al=1,dy=0,sc=1,s=x.text;
  if(x.anim==='fade')al=Math.max(0,Math.min(1,a/.4,(x.dur-a)/.4));
  if(x.anim==='slide'){al=e;dy=(1-e)*H*.07}
  if(x.anim==='pop')sc=1+2.7*Math.pow(e-1,3)+1.7*Math.pow(e-1,2);
  if(x.anim==='type')s=s.slice(0,Math.ceil(s.length*Math.min(1,a/(x.dur*.7))));
  cx.save();cx.globalAlpha=al;cx.font=`${x.italic?'italic ':''}${x.bold?'700':'400'} ${fs}px ${x.font}`;cx.textBaseline='middle';cx.textAlign='left';cx.lineJoin='round';
  const lines=[];
  s.split('\n').forEach(p=>{let ln=[];p.split(/\s+/).filter(Boolean).forEach(w=>{if(ln.length&&cx.measureText([...ln,w].join(' ')).width>W*.9){lines.push(ln);ln=[w]}else ln.push(w)});lines.push(ln)});
  const lh=fs*1.25,pad=fs*.4,wd=lines.map(l=>cx.measureText(l.join(' ')).width),bw=Math.max(0,...wd)+pad*2,bh=lines.length*lh+pad*2;
  cx.translate(W/2+x.x*W/100,H*x.y/100+dy);cx.scale(sc,sc);
  if(x.bga>0){cx.globalAlpha=al*x.bga/100;cx.fillStyle=x.bgc;cx.beginPath();cx.roundRect?cx.roundRect(-bw/2,-bh/2,bw,bh,pad*.6):cx.rect(-bw/2,-bh/2,bw,bh);cx.fill();cx.globalAlpha=al}
  const n=lines.flat().length,hn=x.anim==='karaoke'?Math.ceil(Math.min(1,a/x.dur)*n):0;let i=0;
  lines.forEach((l,r)=>{let px=-wd[r]/2;const py=(r-(lines.length-1)/2)*lh;
    l.forEach(w=>{
      if(x.sw>0){cx.shadowColor='transparent';cx.strokeStyle=x.stroke;cx.lineWidth=x.sw*u*2;cx.strokeText(w,px,py)}
      cx.shadowColor=x.sh>0?x.shc:'transparent';cx.shadowBlur=x.sh*u;cx.fillStyle=i<hn?x.hl:x.color;cx.fillText(w,px,py);
      px+=cx.measureText(w+' ').width;i++})});
  cx.restore();
}
function updateTime(){const T=total();$('#ph').style.left=(T?t/T*100:0)+'%';$('#tm').textContent=fmt(t)+' / '+fmt(T)}

function show(){
  const p=locate(t);if(!p){render();return}
  const c=p.c,src=c.in+p.l*c.speed;
  if(cur&&cur.el!==c.el&&cur.isV)cur.el.pause();
  if(c.isV){
    const d=Math.abs(c.el.currentTime-src);
    if(playing?d>.35:d>.03)c.el.currentTime=src;
    c.el.playbackRate=c.speed;
    if(playing&&c.el.paused)c.el.play().catch(()=>{});
    if(!playing&&!c.el.paused)c.el.pause();
  }
  cur=c;render();
}
function tick(n){
  if(!playing)return;
  t+=(n-last)/1000;last=n;const T=total();
  if(t>=T){t=T;show();stop();return}
  show();requestAnimationFrame(tick);
}
function play(){if(!clips.length)return;initAudio();if(t>=total()-.05)t=0;playing=true;last=performance.now();$('#pp').textContent='⏸';requestAnimationFrame(tick)}
function stop(){playing=false;$('#pp').textContent='▶';clips.forEach(c=>c.isV&&c.el.pause());if(recog)recog.stop();if(exporting&&rec&&rec.state==='recording')setTimeout(()=>rec.stop(),300)}

function exportVid(){
  if(!clips.length||exporting)return;stop();initAudio();
  const mt=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m));
  if(!mt){alert('Trình duyệt này không hỗ trợ xuất video. Hãy thử Chrome.');return}
  const s=cv.captureStream(30),ch=[];dest.stream.getAudioTracks().forEach(a=>s.addTrack(a));
  rec=new MediaRecorder(s,{mimeType:mt,videoBitsPerSecond:8e6});
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(ch,{type:mt}));a.download='GNT-'+Date.now()+(mt.includes('mp4')?'.mp4':'.webm');a.click();exporting=false;$('#ex').textContent='Xuất video';document.body.classList.remove('busy')};
  exporting=true;document.body.classList.add('busy');$('#ex').textContent='Đang xuất… giữ tab mở';
  t=0;cur=null;show();rec.start();play();
}

function tlr(){
  const T=total(),box=$('#clips');box.innerHTML='';
  clips.forEach(c=>{const d=document.createElement('div'),b=document.createElement('b'),i=document.createElement('i');d.className='clip'+(c===sel?' on':'');d.style.width=dur(c)/T*100+'%';b.textContent=c.name;i.textContent=dur(c).toFixed(1)+'s';d.append(b,i);box.append(d)});
  const tx=$('#tx');tx.innerHTML='';
  if(T)texts.forEach(x=>{const d=document.createElement('div'),s0=Math.min(x.start/T,1);d.className='cap'+(x===selT?' on':'');d.dataset.id=x.id;d.style.left=s0*100+'%';d.style.width=Math.min(x.dur/T,1-s0)*100+'%';d.textContent=x.text;tx.append(d)});
  updateTime();
}
function sl(box,label,o,key,min,max,step,fn,fmtv){
  const r=document.createElement('label');r.className='sl';
  r.innerHTML='<span>'+label+'</span><output></output><input type="range">';
  const i=r.querySelector('input'),out=r.querySelector('output');
  Object.assign(i,{min,max,step});
  const set=()=>{i.value=o[key];out.textContent=fmtv?fmtv(o[key]):+(+o[key]).toFixed(2)};set();
  i.oninput=()=>{o[key]=+i.value;if(fn)fn();set();tlr();show()};
  box.append(r);
}
function btn(box,label,fn,on){const b=document.createElement('button');b.textContent=label;if(on)b.className='on';b.onclick=fn;box.append(b);return b}
function head(P,t){const h=document.createElement('h2');h.textContent=t;P.append(h)}

function panel(){
  const P=$('#panel'),c=sel;P.innerHTML='';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tab==='txt')return panelTxt(P);
  if(tab==='cap')return panelCap(P);
  if(tab==='frame'){
    head(P,'Tỷ lệ khung hình');const r=document.createElement('div');r.className='row';
    Object.keys(RATIOS).forEach(k=>btn(r,k,()=>{setRatio(k);panel();render()},k===ratio));P.append(r);
    head(P,'Màu nền');const i=document.createElement('input');i.type='color';i.value=bg;i.oninput=()=>{bg=i.value;render()};P.append(i);return;
  }
  if(!c){P.innerHTML='<p class="hint">Nhập clip rồi chọn một clip trên timeline để chỉnh.</p>';return}
  if(tab==='edit'){
    sl(P,'Cắt đầu (giây)',c,'in',0,c.max,.1,()=>{c.in=Math.min(c.in,c.out-.1)});
    sl(P,'Cắt cuối (giây)',c,'out',0,c.max,.1,()=>{c.out=Math.max(c.out,c.in+.1)});
    sl(P,'Tốc độ (×)',c,'speed',.25,4,.05);
    sl(P,'Phóng to / Crop (%)',c,'zoom',25,400,1);
    sl(P,'Vị trí ngang',c,'x',-100,100,1);sl(P,'Vị trí dọc',c,'y',-100,100,1);
    sl(P,'Độ trong suốt (%)',c,'op',0,100,1);
    const r=document.createElement('div');r.className='row';
    btn(r,'Xoay 90°',()=>{c.rot=(c.rot+1)%4;render()});btn(r,'Lật ngang',()=>{c.flip=!c.flip;render()});P.append(r);
  }else{
    COLS.forEach(([k,n,a,b])=>sl(P,n,c.col,k,a,b,1));
    head(P,'Bộ lọc màu');const r=document.createElement('div');r.className='row';
    Object.keys(PRESETS).forEach(k=>btn(r,k,()=>{c.col=Object.assign(COL0(),PRESETS[k]);panel();render()}));P.append(r);
    head(P,'Thông số màu');const r2=document.createElement('div');r2.className='row';
    btn(r2,'Sao chép',()=>{clip={...c.col}});btn(r2,'Dán',()=>{if(clip){c.col={...clip};panel();render()}});btn(r2,'Đặt lại',()=>{c.col=COL0();panel();render()});P.append(r2);
  }
}
const BASE={font:FONTS[0][1],size:6,bold:true,italic:false,color:'#ffffff',stroke:'#000000',sw:3,shc:'#000000',sh:0,bgc:'#000000',bga:0,y:82,anim:'none',hl:'#ffd23f'};
const row=()=>{const d=document.createElement('div');d.className='row';return d};
const rt=()=>{tlr();panel();render()};
function addText(o={}){const x={text:'Nhập chữ…',start:t,dur:3,x:0,...BASE,...o,id:Math.random()};texts.push(x);selT=x;return x}
function delText(){texts=texts.filter(x=>x!==selT);selT=texts[0]||null;rt()}
function colorIn(box,label,o,k){const l=document.createElement('label'),i=document.createElement('input');l.append(label);i.type='color';i.value=o[k];i.oninput=()=>{o[k]=i.value;render()};l.append(i);box.append(l)}
function speak(){if(!selT||!window.speechSynthesis)return alert('Trình duyệt chưa hỗ trợ đọc văn bản.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(selT.text);u.lang=lang;speechSynthesis.speak(u)}

function panelTxt(P){
  const r0=row();btn(r0,'＋ Thêm chữ',()=>{addText();rt()});
  if(!selT){P.append(r0);P.insertAdjacentHTML('beforeend','<p class="hint">Bấm “Thêm chữ” để tạo chữ tại vị trí đầu đọc, hoặc chọn một khối chữ trên timeline.</p>');return}
  const x=selT;
  btn(r0,'Nhân bản',()=>{addText({...x,start:x.start+x.dur});rt()});btn(r0,'Xóa',delText);btn(r0,'Đọc thử',speak);P.append(r0);
  const ta=document.createElement('textarea');ta.value=x.text;ta.oninput=()=>{x.text=ta.value;tlr();render()};P.append(ta);
  head(P,'Mẫu chữ');const r1=row();Object.keys(TPL).forEach(k=>btn(r1,k,()=>{Object.assign(x,BASE,TPL[k]);panel();render()}));P.append(r1);
  head(P,'Font');const fs=document.createElement('select');FONTS.forEach(([n,v])=>fs.add(new Option(n,v,false,v===x.font)));fs.onchange=()=>{x.font=fs.value;render()};P.append(fs);
  const fl=document.createElement('label'),ff=document.createElement('input');fl.className='btn';fl.textContent='＋ Tải font từ máy';ff.type='file';ff.accept='.ttf,.otf,.woff,.woff2';ff.hidden=true;fl.append(ff);P.append(fl);
  ff.onchange=async()=>{const f=ff.files[0];if(!f)return;try{const n='F'+Date.now(),face=new FontFace(n,await f.arrayBuffer());await face.load();document.fonts.add(face);FONTS.push([f.name.replace(/\.[^.]+$/,''),`"${n}"`]);x.font=`"${n}"`;panel();render()}catch(e){alert('Không đọc được font này.')}};
  sl(P,'Cỡ chữ',x,'size',2,20,.5);
  const r2=row();btn(r2,'Đậm',()=>{x.bold=!x.bold;panel();render()},x.bold);btn(r2,'Nghiêng',()=>{x.italic=!x.italic;panel();render()},x.italic);P.append(r2);
  const cg=document.createElement('div');cg.className='colors';[['Màu chữ','color'],['Viền','stroke'],['Bóng','shc'],['Nền','bgc'],['Karaoke','hl']].forEach(([n,k])=>colorIn(cg,n,x,k));P.append(cg);
  sl(P,'Độ dày viền',x,'sw',0,10,.5);sl(P,'Độ mờ bóng',x,'sh',0,30,1);sl(P,'Độ đậm nền (%)',x,'bga',0,100,1);
  sl(P,'Vị trí ngang',x,'x',-50,50,1);sl(P,'Vị trí dọc',x,'y',0,100,1);
  head(P,'Hiệu ứng chữ');const as=document.createElement('select');ANIMS.forEach(([v,n])=>as.add(new Option(n,v,false,v===x.anim)));as.onchange=()=>{x.anim=as.value;render()};P.append(as);
  head(P,'Thời gian');const T=Math.max(total(),1);
  sl(P,'Bắt đầu (giây)',x,'start',0,T,.1);sl(P,'Thời lượng (giây)',x,'dur',.3,T,.1);
  const r3=row();btn(r3,'Bắt đầu = đầu đọc',()=>{x.start=t;rt()});btn(r3,'Kết thúc = đầu đọc',()=>{x.dur=Math.max(.3,t-x.start);rt()});btn(r3,'Áp kiểu cho tất cả',()=>{texts.forEach(y=>STY.forEach(k=>y[k]=x[k]));render()});P.append(r3);
}

function panelCap(P){
  head(P,'Ngôn ngữ lời thoại');const ls=document.createElement('select');LANGS.forEach(([v,n])=>ls.add(new Option(n,v,false,v===lang)));ls.onchange=()=>lang=ls.value;P.append(ls);
  head(P,'Phụ đề tự động từ kịch bản');const ta=document.createElement('textarea');ta.placeholder='Dán lời thoại, mỗi dòng một câu…';P.append(ta);
  const r1=row();btn(r1,'Chia đều theo thời lượng',()=>{script(ta.value);panel()});P.append(r1);
  head(P,'Nhận diện lời thoại');const r2=row();btn(r2,recog?'■ Dừng nghe':'● Nghe và tạo phụ đề',listen);P.append(r2);
  P.insertAdjacentHTML('beforeend','<p class="hint">Phát clip qua loa, micro sẽ nghe và tạo phụ đề theo thời gian đang phát. Cần cho phép micro.</p>');
  head(P,'Tệp phụ đề');const r3=row(),fl=document.createElement('label'),fi=document.createElement('input');fl.className='btn';fl.textContent='＋ Nhập .srt';fi.type='file';fi.accept='.srt';fi.hidden=true;fi.onchange=()=>{fi.files[0]&&importSrt(fi.files[0])};fl.append(fi);r3.append(fl);btn(r3,'Xuất .srt',exportSrt);P.append(r3);
  head(P,'Dịch phụ đề');const tg=document.createElement('select');LANGS.forEach(([v,n])=>tg.add(new Option(n,v,false,v==='en-US')));P.append(tg);const r4=row();btn(r4,'Dịch tất cả',()=>translateAll(tg.value));P.append(r4);
  head(P,'Dời thời gian tất cả phụ đề');const r5=row();[-.5,-.1,.1,.5].forEach(d=>btn(r5,(d>0?'+':'')+d+'s',()=>{texts.forEach(x=>x.start=Math.max(0,x.start+d));rt()}));P.append(r5);
  head(P,'Danh sách ('+texts.length+')');const L=document.createElement('div');L.className='list';
  [...texts].sort((a,b)=>a.start-b.start).forEach(x=>{
    const d=document.createElement('div'),sm=document.createElement('small'),i=document.createElement('input');
    d.className='item'+(x===selT?' on':'');sm.textContent=fmt(x.start);
    sm.onclick=()=>{selT=x;stop();t=Math.min(x.start,total());show();tlr();panel()};
    i.type='text';i.value=x.text;i.onfocus=()=>{selT=x;tlr()};i.oninput=()=>{x.text=i.value;tlr();render()};
    d.append(sm,i);L.append(d)});
  P.append(L);
}

function script(s){
  const T=total();if(!T)return alert('Hãy nhập video trước để chia thời gian.');
  const L=s.split(/\n+/).flatMap(l=>l.trim().length>60?l.trim().split(/(?<=[.!?…])\s+/):[l]).map(l=>l.trim()).filter(Boolean);
  if(!L.length)return;const sum=L.reduce((a,l)=>a+l.length,0);let at=0;
  L.forEach(l=>{const d=T*l.length/sum;addText({...CAPSTYLE,text:l,start:at,dur:d});at+=d});tlr();render();
}
const ts=s=>[Math.floor(s/3600),Math.floor(s%3600/60),Math.floor(s%60)].map(v=>String(v).padStart(2,'0')).join(':')+','+String(Math.floor(s%1*1000)).padStart(3,'0');
function dlf(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function exportSrt(){if(!texts.length)return;dlf(new Blob([[...texts].sort((a,b)=>a.start-b.start).map((x,i)=>`${i+1}\n${ts(x.start)} --> ${ts(x.start+x.dur)}\n${x.text}\n`).join('\n')],{type:'text/plain'}),'GNT-phu-de.srt')}
async function importSrt(f){
  const sec=(a,b,c,d)=>+a*3600+ +b*60+ +c+ +d/1000;
  (await f.text()).replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{
    const m=b.match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);if(!m)return;
    const st=sec(m[1],m[2],m[3],m[4]),en=sec(m[5],m[6],m[7],m[8]),tx=b.slice(b.indexOf(m[0])+m[0].length).trim().replace(/<[^>]+>/g,'');
    if(tx)addText({...CAPSTYLE,text:tx,start:st,dur:Math.max(.3,en-st)})});
  rt();
}
async function translateAll(to){
  if(!texts.length)return;
  if(!('Translator' in self)){navigator.clipboard&&navigator.clipboard.writeText(texts.map(x=>x.text).join('\n'));alert('Trình duyệt chưa hỗ trợ dịch tích hợp. Mình đã chép toàn bộ phụ đề vào bộ nhớ tạm, bạn có thể dán vào Google Dịch.');return}
  try{const tr=await Translator.create({sourceLanguage:lang.slice(0,2),targetLanguage:to.slice(0,2)});for(const x of texts)x.text=await tr.translate(x.text);rt()}
  catch(e){alert('Không dịch được cặp ngôn ngữ này: '+e.message)}
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return alert('Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy dùng Chrome.');
  const MIC='Chrome không cho dùng micro ở trang này. Hãy mở GNT qua http://localhost hoặc một địa chỉ https (không mở trực tiếp từ file tải về), rồi bấm “Cho phép” khi Chrome hỏi quyền micro.';
  if(recog){recog.stop();return}
  if(!window.isSecureContext)return alert(MIC);
  if(!clips.length)return alert('Hãy nhập video trước.');
  const r=recog=new SR();let from=t;r.lang=lang;r.continuous=true;
  r.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal){const s=e.results[i][0].transcript.trim();if(s){addText({...CAPSTYLE,text:s,start:from,dur:Math.max(1,t-from)});from=t;tlr()}}};
  r.onend=()=>{recog=null;if(playing)stop();if(tab==='cap')panel()};
  r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;alert(/not-allowed/.test(e.error)?MIC:'Nhận diện bị lỗi: '+e.error)};
  r.start();play();panel();
}

function setRatio(r){ratio=r;[cv.width,cv.height]=RATIOS[r]}
function refresh(){$('#hint').hidden=clips.length>0;tlr();panel();show()}

function split(){const p=locate(t);if(!p)return;const c=p.c,s=c.in+p.l*c.speed;if(s-c.in<.1||c.out-s<.1)return;const n=cl(c);n.in=s;c.out=s;clips.splice(clips.indexOf(c)+1,0,n);sel=n;refresh()}
function dup(){if(!sel)return;const n=cl(sel);clips.splice(clips.indexOf(sel)+1,0,n);sel=n;refresh()}
function del(){if(!sel)return;clips=clips.filter(c=>c!==sel);sel=clips[0]||null;t=Math.min(t,total());cur=null;refresh()}

function seekEv(e){
  const r=$('#tl').getBoundingClientRect(),T=total();if(!T)return;
  t=Math.min(Math.max((e.clientX-r.left)/r.width,0)*T,T);
  const p=locate(t);if(p&&p.c!==sel){sel=p.c;panel();tlr()}show();
}
const tl=$('#tl');
tl.onpointerdown=e=>{
  if(exporting)return;stop();tl.setPointerCapture(e.pointerId);drag=true;
  const cp=e.target.closest('.cap');
  if(cp){selT=texts.find(x=>String(x.id)===cp.dataset.id)||selT;if(tab!=='cap')tab='txt'}
  seekEv(e);if(cp){tlr();panel()}
};
tl.onpointermove=e=>drag&&seekEv(e);
tl.onpointerup=tl.onpointercancel=()=>drag=false;
$('#f').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
$('#pp').onclick=()=>playing?stop():play();
$('#sp').onclick=split;$('#dp').onclick=dup;$('#dl').onclick=del;$('#ex').onclick=exportVid;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;panel()});
document.onkeydown=e=>{
  if(/TEXTAREA|SELECT/.test(e.target.tagName)||['color','text'].includes(e.target.type)||exporting)return;
  if(e.code==='Space'){e.preventDefault();playing?stop():play()}
  else if(e.key==='s'||e.key==='S')split();
  else if(e.key==='Delete')tab==='txt'&&selT?delText():del();
};
panel();render();
</script>
